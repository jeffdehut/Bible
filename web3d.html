<style>
/* The web of Scripture in space: WebGL points and threads, turned with a finger or a mouse.
   The stage is always night, whatever the theme, so the colors glow. */
:root, :root[data-theme="light"], :root[data-theme="dark"] {
  --bg: #05070d; --surface: #111827; --ink: #e9ecf3; --muted: #a3acbd; --faint: #6f7a90; --line: #232c40;
  --lapis: #9db3ff; --lapis-soft: #1c2650;
  --read: "Frank Ruhl Libre", "Noto Serif", Georgia, serif;
  --sans: "Libre Franklin", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; overflow: hidden; background: radial-gradient(120% 90% at 50% 40%, #0d1424 0%, #05070d 70%) fixed, var(--bg); color: var(--ink); font: 400 16px/1.5 var(--sans);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
a { color: var(--lapis); }
.stage { position: fixed; inset: calc(var(--bar) + env(safe-area-inset-top, 0px)) 0 0 0; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#gl { touch-action: none; cursor: grab; }
#gl.dragging { cursor: grabbing; }
#labels { pointer-events: none; }
.title { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); top: 14px; pointer-events: none; max-width: min(520px, calc(100% - 92px)); }
.title h1 { margin: 0; font: 300 clamp(26px, 5vw, 40px)/1.05 var(--read); letter-spacing: -0.01em; }
.title p { margin: 4px 0 0; color: var(--muted); font-size: 13.5px; }
.tools { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); top: 12px; display: flex; flex-direction: column; gap: 6px; }
.tools button, .find input { border: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 82%, transparent); color: var(--ink); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.tools button { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; cursor: pointer; }
.tools button[aria-pressed="true"] { background: var(--lapis-soft); border-color: var(--lapis); color: var(--lapis); }
.tools svg { width: 20px; height: 20px; }
.find { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: max(14px, env(safe-area-inset-bottom, 0px)); width: min(320px, calc(100% - 32px)); }
.find input { width: 100%; height: 44px; border-radius: 12px; padding: 0 14px; font: 400 15px/1 var(--sans); }
.find input::placeholder { color: var(--faint); }
.find ul { list-style: none; margin: 0 0 6px; padding: 4px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); max-height: 46vh; overflow: auto; }
.find li button { width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 0; border-radius: 8px; background: transparent; color: var(--ink); font: 400 14.5px/1.25 var(--sans); text-align: left; cursor: pointer; }
.find li button:hover, .find li button:focus-visible, .find li button[aria-selected="true"] { background: var(--lapis-soft); outline: none; }
.find li small { margin-left: auto; color: var(--faint); font-size: 12px; white-space: nowrap; }
.dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); }
.key { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); bottom: max(14px, env(safe-area-inset-bottom, 0px)); display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px 10px; max-width: 420px; font: 500 12px/1.3 var(--sans); color: var(--muted); pointer-events: none; }
.key span { display: inline-flex; align-items: center; gap: 5px; }
.key .dot { width: 8px; height: 8px; }
@media (max-width: 700px) { .key { display: none; } }
/* The card: a panel of ui.js (a sheet from the bottom on phones, down the right on larger screens). */
.card { background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
@media (min-width: 760px) { body.ui-panel-open .tools, body.ui-panel-open .key { right: calc(var(--ui-panel-w) + 12px); } }
.card .kicker { display: flex; align-items: center; gap: 8px; font: 600 11.5px/1.3 var(--sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding-right: 40px; }
.card h2 { margin: 6px 0 4px; font: 400 28px/1.12 var(--read); }
.card p { margin: 0 0 10px; color: var(--muted); font-size: 14px; }
.card .acts { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; }
.card .acts a { display: inline-flex; min-height: 36px; align-items: center; padding: 6px 12px; border-radius: 10px; background: var(--lapis-soft); color: var(--lapis); font: 600 14px/1.2 var(--sans); text-decoration: none; }
.card .acts a.solid { background: var(--lapis); color: #0b1020; }
.card h3 { margin: 10px 0 6px; font: 600 11.5px/1.3 var(--sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 99px; background: transparent; color: var(--ink); font: 500 13px/1.2 var(--sans); cursor: pointer; }
.chips button:hover, .chips button:focus-visible { border-color: var(--lapis); }
.chips .dot { width: 8px; height: 8px; }
.card .close { position: absolute; top: 10px; right: 10px; z-index: 4; width: 36px; height: 36px; border: 0; border-radius: 10px; background: transparent; color: var(--ink); cursor: pointer; font-size: 16px; }
.hint { position: absolute; left: 50%; bottom: calc(max(14px, env(safe-area-inset-bottom, 0px)) + 58px); transform: translateX(-50%); width: max-content; max-width: calc(100% - 32px); padding: 6px 12px; border-radius: 99px; background: rgb(5 7 13 / 70%); color: var(--muted); font-size: 14px; text-align: center; pointer-events: none; transition: opacity 0.6s; }
.hint.gone { opacity: 0; }
.nogl { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); }
</style>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const el = (tag, attrs = {}, ...kids) => { const e = document.createElement(tag); for (const k in attrs) { if (k === "text") e.textContent = attrs[k]; else if (k === "class") e.className = attrs[k]; else if (k.startsWith("on")) e.addEventListener(k.slice(2), attrs[k]); else e.setAttribute(k, attrs[k]); } for (const c of kids) if (c != null) e.append(c); return e; };
  const fmt = new Intl.NumberFormat("en");
  const yl = y => (y <= 0 ? `${1 - y} BC` : `AD ${y}`);
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // The colors of the Connections page, on its night stage.
  const GROUPS = [
    { name: "Torah", icon: "torah", sec: [0], c: "#f2c45a" }, { name: "History", icon: "history", sec: [1], c: "#f59a62" },
    { name: "Wisdom", icon: "wisdom", sec: [2], c: "#8fdc8a" }, { name: "Prophets", icon: "prophets", sec: [3], c: "#ff7272" },
    { name: "Gospels", icon: "gospels", sec: [4], c: "#6fb0ff" }, { name: "Acts", icon: "acts", sec: [5], c: "#4fd6cb" },
    { name: "Letters", icon: "letters", sec: [6, 7], c: "#b996ff" }, { name: "Revelation", icon: "revelation", sec: [8], c: "#ff86c0" },
    { name: "People", icon: "person", kind: 1, c: "#aab6d8" }, { name: "Places", icon: "place", kind: 2, c: "#7fd6b4" }, { name: "Events", icon: "event", kind: 3, c: "#ffd27a" },
  ];
  const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255);
  const KIND_NAME = ["Chapter", "Person", "Place", "Event"];
  const TYPES = ["xref", "seq", "names", "together", "family", "event"];

  let D, N, NC, kind, group, P, deg, adj, linkA, linkB, linkT, chapterOf = [], bookOf = [], bookStart = [], briefs = null;
  const tr = (window.I18N ? I18N.t : s => s);
  const label = k => (k < NC ? `${tr(D.books[bookOf[k]][0])} ${chapterOf[k]}` : tr(D.n[k - NC].replace(/ \((.+ \d+\.\d+)\)$/, "")));
  const sizeOf = i => (i < NC ? 9 : 6) + 2.6 * Math.sqrt(deg[i]);   // a point's size, across, in the web's units
  const slug = s => s.toLowerCase().replace(/ /g, "-");
  const refOf = k => { const j = k - NC, b = D.f[3 * j]; return b < 0 ? null : [b, D.f[3 * j + 1], D.f[3 * j + 2]]; };

  function unpack(data, space) {
    D = data;
    NC = D.kinds[0]; N = NC + D.kinds[1] + D.kinds[2] + D.kinds[3];
    kind = new Uint8Array(N); group = new Uint8Array(N);
    let k = 0;
    D.books.forEach(([, , sec, n], b) => {
      bookStart[b] = k;
      const g = GROUPS.findIndex(G => G.sec && G.sec.includes(sec));
      for (let c = 1; c <= n; c++, k++) { chapterOf[k] = c; bookOf[k] = b; group[k] = g; }
    });
    for (let i = NC; i < N; i++) {
      kind[i] = i < NC + D.kinds[1] ? 1 : i < NC + D.kinds[1] + D.kinds[2] ? 2 : 3;
      group[i] = GROUPS.findIndex(G => G.kind === kind[i]);
    }
    P = Float32Array.from(space.p);
    const A = [], B = [], T = [];
    for (let i = 0; i + 1 < NC; i++) { A.push(i); B.push(i + 1); T.push(1); }
    for (const [t, flat] of Object.entries(D.links)) {
      const ti = TYPES.indexOf(t);
      let a = 0, b = 0;
      for (let j = 0; j < flat.length; j += 2) {
        if (j && flat[j] === 0) b += flat[j + 1];
        else { a += flat[j]; b = a + flat[j + 1]; }
        A.push(a); B.push(b); T.push(ti);
      }
    }
    linkA = Uint16Array.from(A); linkB = Uint16Array.from(B); linkT = Uint8Array.from(T);
    deg = new Uint16Array(N); adj = Array.from({ length: N }, () => []);
    for (let e = 0; e < linkA.length; e++) { deg[linkA[e]]++; deg[linkB[e]]++; adj[linkA[e]].push(linkB[e]); adj[linkB[e]].push(linkA[e]); }
  }

  /* ---------- Matrices (column-major, as WebGL wants them) ---------- */
  const perspective = (fov, aspect, near, far) => { const f = 1 / Math.tan(fov / 2), nf = 1 / (near - far); return [f / aspect, 0, 0, 0, 0, f, 0, 0, 0, 0, (far + near) * nf, -1, 0, 0, 2 * far * near * nf, 0]; };
  const mul = (a, b) => { const o = new Array(16); for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) o[c * 4 + r] = a[r] * b[c * 4] + a[4 + r] * b[c * 4 + 1] + a[8 + r] * b[c * 4 + 2] + a[12 + r] * b[c * 4 + 3]; return o; };
  function lookAt(eye, at) {
    const z = norm(sub(eye, at)), x = norm(cross([0, 1, 0], z)), y = cross(z, x);
    return [x[0], y[0], z[0], 0, x[1], y[1], z[1], 0, x[2], y[2], z[2], 0, -dot(x, eye), -dot(y, eye), -dot(z, eye), 1];
  }
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const norm = a => { const l = Math.hypot(...a) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };

  /* ---------- WebGL ---------- */
  const gl = $("gl").getContext("webgl", { antialias: true, alpha: true, premultipliedAlpha: false });
  const lc = $("labels").getContext("2d");
  if (!gl) {
    $("hint").remove();
    $("stage").append(el("div", { class: "nogl" }, el("p", {}, "This view needs WebGL, which this browser has turned off. ", el("a", { href: "graph.html", text: "The web is also on the Connections page." }))));
    return;
  }
  function program(vs, fs) {
    const p = gl.createProgram();
    for (const [type, src] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]) {
      const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
      gl.attachShader(p, s);
    }
    gl.linkProgram(p);
    return p;
  }
  // Fog: the far side of the web fades, so near and far read at a glance.
  const FOG = `uniform vec2 u_fog; float fog(vec4 v) { return clamp((u_fog.y + v.z) / (u_fog.y - u_fog.x), 0.12, 1.0); }`;
  const pointProg = program(`
    attribute vec3 a_p; attribute vec3 a_c; attribute float a_s; attribute float a_h;
    uniform mat4 u_view; uniform mat4 u_proj; uniform float u_px; uniform float u_t; uniform float u_live;
    varying vec3 v_c; varying float v_a; ${FOG}
    void main() {
      vec4 v = u_view * vec4(a_p, 1.0);
      gl_Position = u_proj * v;
      float tw = 1.0 + u_live * 0.18 * sin(u_t * 1.3 + a_p.x * 0.013 + a_p.y * 0.017);
      float s = a_s * (a_h > 1.5 ? 1.6 : 1.0) * tw;
      gl_PointSize = clamp(s * u_px / gl_Position.w, 2.0, a_h < 0.5 ? 24.0 : 56.0);
      v_c = a_c;
      v_a = fog(v) * (a_h < 0.5 ? 0.1 : a_h > 1.5 ? 1.0 : 0.62);
    }`, `
    precision mediump float; varying vec3 v_c; varying float v_a;
    void main() {
      float d = length(gl_PointCoord - 0.5) * 2.0;
      if (d > 1.0) discard;
      float core = smoothstep(0.55, 0.35, d), glow = exp(-d * d * 3.5);
      gl_FragColor = vec4(mix(v_c, vec3(1.0), core * 0.3) * (core + glow * 0.55) * v_a, 1.0);
    }`);
  const lineProg = program(`
    attribute vec3 a_p; attribute vec3 a_c; attribute float a_a;
    uniform mat4 u_view; uniform mat4 u_proj; varying vec3 v_c; varying float v_a; ${FOG}
    void main() { vec4 v = u_view * vec4(a_p, 1.0); gl_Position = u_proj * v; v_c = a_c; v_a = a_a * fog(v); }`, `
    precision mediump float; varying vec3 v_c; varying float v_a;
    void main() { gl_FragColor = vec4(v_c * v_a, 1.0); }`);

  const buf = (data, usage = gl.STATIC_DRAW) => { const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, data, usage); return b; };
  const attr = (prog, name, b, size) => { const loc = gl.getAttribLocation(prog, name); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, size, gl.FLOAT, false, 0, 0); };
  let pBuf, cBuf, sBuf, hBuf, H, lpBuf, lcBuf, laBuf, LA, baseLA;

  function buffers() {
    const C = new Float32Array(N * 3), S = new Float32Array(N);
    for (let i = 0; i < N; i++) {
      C.set(hex(GROUPS[group[i]].c), 3 * i);
      S[i] = sizeOf(i);
    }
    H = new Float32Array(N).fill(1);
    pBuf = buf(P); cBuf = buf(C); sBuf = buf(S); hBuf = buf(H, gl.DYNAMIC_DRAW);
    const E = linkA.length, LP = new Float32Array(E * 6), LC = new Float32Array(E * 6);
    LA = new Float32Array(E * 2); baseLA = new Float32Array(E * 2);
    for (let e = 0; e < E; e++) {
      const a = linkA[e], b = linkB[e];
      LP.set(P.subarray(3 * a, 3 * a + 3), 6 * e); LP.set(P.subarray(3 * b, 3 * b + 3), 6 * e + 3);
      LC.set(C.subarray(3 * a, 3 * a + 3), 6 * e); LC.set(C.subarray(3 * b, 3 * b + 3), 6 * e + 3);
      // The threads between chapters show most; names and families stay a faint haze.
      const w = linkT[e] === 0 ? 0.11 : linkT[e] === 1 ? 0.22 : 0.035;
      baseLA[2 * e] = baseLA[2 * e + 1] = w;
    }
    LA.set(baseLA);
    lpBuf = buf(LP); lcBuf = buf(LC); laBuf = buf(LA, gl.DYNAMIC_DRAW);

    if (e.target.closest("input")) return;
    if (e.key === "Escape") select(null, { fly: false });
    const step = { ArrowLeft: [-0.12, 0], ArrowRight: [0.12, 0], ArrowUp: [0, 0.1], ArrowDown: [0, -0.1] }[e.key];
    if (step && e.shiftKey) { e.preventDefault(); wake(); panBy(-step[0] * 300, step[1] * 300); }
    else if (step) { e.preventDefault(); wake(); cam.yaw += step[0]; cam.pitch = Math.max(-1.45, Math.min(1.45, cam.pitch + step[1])); }
    if (e.key === "+" || e.key === "=") { wake(); cam.dist = clampDist(cam.dist / 1.2); }
    if (e.key === "-") { wake(); cam.dist = clampDist(cam.dist * 1.2); }
  });

  /* ---------- The tools ---------- */
  let helpTimer;
  function showHelp(ms = 6000) {
    $("hint").textContent = matchMedia("(pointer: coarse)").matches
      ? "Drag to turn · two fingers to slide and pinch to fly in · tap a point"
      : "Drag to turn · right-drag or Shift-drag to slide · scroll to fly in · click a point";
    $("hint").classList.remove("gone");
    clearTimeout(helpTimer); helpTimer = setTimeout(() => $("hint").classList.add("gone"), ms);
  }
  $("help").onclick = () => showHelp();
  const setSpin = on => { spin = on; $("spin").setAttribute("aria-pressed", String(on)); };
  setSpin(spin);
  $("spin").onclick = () => setSpin(!spin);
  $("home").onclick = () => { select(null, { fly: false }); flyTo(home.at, home.dist, 1200); };
  $("threads").onclick = () => {
    threadsOnly = !threadsOnly; $("threads").setAttribute("aria-pressed", String(threadsOnly));
    select(selected, { fly: false });
  };

  /* ---------- Finding ---------- */
  let found = [], cursor = -1;
  function search(q) {
    q = q.trim().toLowerCase();
    if (!q) { $("results").hidden = true; found = []; return; }
    const m = /^(.+?)\s*(\d+)$/.exec(q);
    const out = [];
    if (m) {
      const b = D.books.findIndex(([name, osis]) => name.toLowerCase().startsWith(m[1]) || osis.toLowerCase() === m[1]);
      if (b >= 0 && +m[2] >= 1 && +m[2] <= D.books[b][3]) out.push(bookStart[b] + +m[2] - 1);
    }
    const starts = [], has = [];
    for (let i = NC; i < N; i++) { const n = D.n[i - NC].toLowerCase(); if (n.startsWith(q)) starts.push(i); else if (n.includes(q)) has.push(i); }
    D.books.forEach(([name], b) => { if (!m && name.toLowerCase().startsWith(q)) out.push(bookStart[b]); });
    const byDeg = (a, b) => deg[b] - deg[a];
    found = [...out, ...starts.sort(byDeg), ...has.sort(byDeg)].slice(0, 9);
    cursor = -1;
    $("results").replaceChildren(...found.map((j, k) => el("li", {}, el("button", { type: "button", role: "option", "aria-selected": "false", onclick: () => pick(j) },
      dotOf(j), label(j), el("small", { text: j < NC ? "Chapter" : KIND_NAME[kind[j]] })))));
    $("results").hidden = !found.length;
  }
  function pick(j) { $("q").value = ""; $("results").hidden = true; $("q").blur(); select(j); }
  $("q").addEventListener("input", e => search(e.target.value));
  $("q").addEventListener("keydown", e => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      cursor = Math.max(0, Math.min(found.length - 1, cursor + (e.key === "ArrowDown" ? 1 : -1)));
      [...$("results").querySelectorAll("button")].forEach((b, k) => b.setAttribute("aria-selected", String(k === cursor)));
    }
    if (e.key === "Enter" && found.length) pick(found[Math.max(0, cursor)]);
    if (e.key === "Escape") { $("q").value = ""; search(""); }
  });

  function fromHash() {
    const h = decodeURIComponent(location.hash.slice(1));
    let m;
    if ((m = /^n(\d+)$/.exec(h)) && +m[1] < N) return +m[1];
    if ((m = /^(.+)-(\d+)$/.exec(h))) {
      const b = D.books.findIndex(([name]) => slug(name) === m[1]);
      if (b >= 0 && +m[2] >= 1 && +m[2] <= D.books[b][3]) return bookStart[b] + +m[2] - 1;
    }
    return null;
  }

  Promise.all([fetch("data/graph.json").then(r => r.json()), fetch("data/web3d.json").then(r => r.json())]).then(([data, space]) => {
    unpack(data, space);
    bookCenters = D.books.map(([, , , n], b) => {
      let x = 0, y = 0, z = 0;
      for (let c = 0; c < n; c++) { const i = bookStart[b] + c; x += P[3 * i]; y += P[3 * i + 1]; z += P[3 * i + 2]; }
      return [b, x / n, y / n, z / n, n];
    }).sort((a, b) => b[4] - a[4]);
    $("count").textContent = `${fmt.format(NC)} chapters · ${fmt.format(D.kinds[1])} people · ${fmt.format(D.kinds[2])} places · ${fmt.format(D.kinds[3])} events · ${fmt.format(linkA.length)} threads`;
    $("key").replaceChildren(...GROUPS.map(G => el("span", {}, el("span", { class: "dot", style: `--c:${G.c}` }), G.name)));
    resize(); buffers(); fitHome();
    showHelp(7000);
    const i = fromHash();
    if (i != null) setTimeout(() => select(i), still ? 0 : 1200);
    requestAnimationFrame(frame);
  }).catch(() => { $("hint").textContent = "The web could not be loaded. Check the connection and try again."; });
  addEventListener("resize", () => { if (D) resize(); });
  addEventListener("hashchange", () => { const i = fromHash(); if (i != null && i !== selected) select(i); });
})();
</script>

</body>
</html>
