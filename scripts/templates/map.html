<title>{{TITLE}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="{{DESCRIPTION}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Rokkitt:wght@500;600;700&family=Libre+Franklin:wght@400;500;600;700&display=swap">
<style>
/* The sheet is always printed paper; only the controls around it follow the light or dark
   theme. Colors of the sheet are the Eilers palette in ROADMAP.md. */
:root {
  --table: #d8d0bc;
  --chrome: rgb(255 253 247 / 92%);
  --chrome-solid: #fffdf7;
  --ink: #1f1b16;
  --muted: #5e5546;
  --line: #d6ccb6;
  --accent: #a8301a;
  --shadow: 0 1px 2px rgb(31 27 22 / 10%), 0 8px 28px rgb(31 27 22 / 14%);
  --sans: "Libre Franklin", system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif: "Old Standard TT", Georgia, serif;
  --sheet-filter: none;

  --paper: #f6f0dd;
  --wild: #efe6cc;
  --yellow: #f6e27f;
  --salmon: #f2b98a;
  --blush: #f8d8c0;
  --lime: #e3e6a2;
  --sage: #c9d8a5;
  --olive: #d9c784;
  --water: #c6d7d8;
  --map-ink: #1f1b16;
  --vermilion: #d8432a;
  --deep-red: #a8301a;
  --river: #2c4a60;
  --wave: #4d6470;
  --region-ink: #6b5a45;
  /* Journeys, each in its own ink, as on the Eilers map of St. Paul's travels. */
  --route-red: #d8432a;
  --route-blue: #2b5a8c;
  --route-green: #2f7a3e;
  --route-violet: #6b3d8e;
  --route-brown: #8a5a2b;
  --route-black: #2a2420;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --table: #191714; --chrome: rgb(32 29 25 / 92%); --chrome-solid: #201d19; --ink: #efe8da;
    --muted: #b3a891; --line: #3a342b; --accent: #f08a6c;
    --shadow: 0 1px 2px rgb(0 0 0 / 40%), 0 10px 30px rgb(0 0 0 / 45%);
    --sheet-filter: brightness(0.86) contrast(1.04);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --table: #191714; --chrome: rgb(32 29 25 / 92%); --chrome-solid: #201d19; --ink: #efe8da;
  --muted: #b3a891; --line: #3a342b; --accent: #f08a6c;
  --shadow: 0 1px 2px rgb(0 0 0 / 40%), 0 10px 30px rgb(0 0 0 / 45%);
  --sheet-filter: brightness(0.86) contrast(1.04);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden]:not(.ui-sheet) { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--table); color: var(--ink);
  font: 400 15px/1.45 var(--sans); overflow: hidden;
  -webkit-text-size-adjust: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#stage { position: fixed; inset: 0; touch-action: none; }
#map { display: block; width: 100%; height: 100%; cursor: grab; user-select: none; -webkit-user-select: none; }
#map:active { cursor: grabbing; }
#world, #labels { filter: var(--sheet-filter); }

/* Floating controls */
.bar {
  position: fixed; z-index: 3; top: max(10px, env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px));
  right: max(16px, env(safe-area-inset-right, 0px)); display: flex; gap: 10px; align-items: flex-start;
  justify-content: space-between; pointer-events: none;
}
.bar > * { pointer-events: auto; }
.tag {
  background: var(--chrome); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow);
  padding: 8px 12px 9px 6px; min-width: 0; max-width: min(460px, 58vw);
  display: flex; gap: 6px; align-items: center;
}
.tag .txt { min-width: 0; }
.tag .home {
  display: grid; place-items: center; flex: none; width: 30px; height: 34px; border-radius: 8px; color: var(--ink);
}
.tag .home:hover { background: color-mix(in srgb, var(--accent) 14%, transparent); }
.tag .home svg { width: 18px; height: 18px; }
.tag .no { font: 600 11px/1.2 var(--sans); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.tag h1 { margin: 2px 0 0; font: 700 17px/1.15 var(--serif); letter-spacing: 0.01em; }
.tag select {
  margin-top: 5px; max-width: 100%; font: 600 12.5px/1.2 var(--sans); color: var(--ink); background: transparent;
  border: 1px solid var(--line); border-radius: 8px; padding: 4px 6px;
}
.tag .draft { display: inline-block; margin-left: 6px; padding: 1px 6px; border-radius: 99px; background: var(--accent); color: var(--chrome-solid); font: 600 10px/1.5 var(--sans); letter-spacing: 0.08em; vertical-align: 2px; }
.tools {
  display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end;
  background: var(--chrome); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 4px;
}
.tools button, .zoom button {
  display: inline-flex; align-items: center; gap: 6px; border: 0; background: transparent;
  border-radius: 8px; padding: 7px 10px; font: 600 13px/1 var(--sans); cursor: pointer; min-height: 34px;
}
.tools button:hover, .zoom button:hover, .tools button[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 14%, transparent); }
.tools svg, .zoom svg { width: 17px; height: 17px; flex: none; }
.zoom {
  position: fixed; z-index: 3; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(14px, env(safe-area-inset-bottom, 0px));
  display: grid; background: var(--chrome); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 4px;
}
.zoom button { justify-content: center; padding: 8px; min-width: 40px; min-height: 40px; }
.tools { flex-wrap: nowrap; }
@media (max-width: 640px) {
  .tools .lbl { display: none; }
  .tools button { padding: 7px 8px; }
  .tag { max-width: calc(100vw - 210px); padding: 7px 10px 8px 4px; }
  .tag .no { font-size: 10px; letter-spacing: 0.08em; }
  .tag h1 { font-size: 14px; }
  .tag .draft { font-size: 9px; }
  .tag .wide { display: none; }
  .tag h1 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .tag:has(#period-pick:not([hidden])) { min-width: 178px; }
  .tag select { width: 100%; }
}

/* Side panels and the place card: the site's shared panel (ui.js) places them, a sheet from the
   bottom on phones, down the right-hand side under the toolbar on wider screens. */
.panel, .card { background: var(--chrome-solid); }
body.ui-panel-open .zoom { right: calc(var(--ui-panel-w) + 16px); }
.panel h2 { margin: 0 0 8px; font: 700 18px/1.2 var(--serif); }
.panel p { margin: 0 0 10px; color: var(--muted); font-size: 14px; }
.panel p strong { color: var(--ink); }
.panel .close { position: absolute; z-index: 4; top: 8px; right: 8px; border: 0; background: transparent; border-radius: 8px; padding: 6px; cursor: pointer; }
.panel .close svg { width: 18px; height: 18px; display: block; }
.panel a { color: var(--accent); }
#find input {
  width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px;
  background: transparent; color: var(--ink); font: 400 15px/1.3 var(--sans); margin-bottom: 8px;
}
#find ol { list-style: none; margin: 0; padding: 0; }
#find li button {
  display: grid; grid-template-columns: 1fr auto; gap: 8px; width: 100%; text-align: left; border: 0;
  background: transparent; padding: 7px 8px; border-radius: 8px; cursor: pointer;
}
#find li button:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
#find .nm { font: 700 15px/1.25 var(--serif); }
#find .sub { display: block; font-size: 12px; color: var(--muted); }
#find .ref { font: 600 12px/1.6 var(--sans); color: var(--muted); font-variant-numeric: tabular-nums; }
#find .count { font-size: 12px; color: var(--muted); margin: 0 0 6px; }
.toggles { display: grid; gap: 8px; margin: 4px 0 2px; }
.toggles label { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; font-size: 14px; }
.toggles input { margin-top: 3px; accent-color: var(--accent); }
.toggles small { display: block; color: var(--muted); font-size: 12px; }
.about h3 { font: 700 14px/1.3 var(--sans); margin: 14px 0 4px; }
.about ul { margin: 0 0 8px; padding-left: 18px; color: var(--muted); font-size: 13.5px; }
.about li { margin-bottom: 3px; }

/* Place card */
.card h2 { margin: 0 34px 2px 0; font: 700 21px/1.15 var(--serif); }
.card .kind { font: 600 11px/1.3 var(--sans); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.card dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 8px 0 0; font-size: 13.5px; }
.card dt { color: var(--muted); }
.card dd { margin: 0; }
.card .close { position: absolute; z-index: 4; top: 8px; right: 8px; border: 0; background: transparent; border-radius: 8px; padding: 6px; cursor: pointer; }
.card .close svg { width: 18px; height: 18px; display: block; }
.card a { color: var(--accent); }
.card .back { display: inline-flex; align-items: center; gap: 4px; margin: 0 34px 6px 0; font: 600 13px/1.3 var(--sans); text-decoration: none; }
.card .back svg { width: 15px; height: 15px; flex: none; }

/* Labels drawn over the sheet */
#labels text { pointer-events: none; }
#labels .hit { pointer-events: all; cursor: pointer; fill: transparent; }
.lbl-place { font-family: var(--serif); font-weight: 700; fill: var(--map-ink); paint-order: stroke; stroke: var(--paper); stroke-width: 3px; stroke-linejoin: round; }
.lbl-place.unsure { font-weight: 400; }
.lbl-modern { font-family: var(--serif); font-style: italic; font-weight: 400; fill: #5a4e3f; paint-order: stroke; stroke: var(--paper); stroke-width: 3px; stroke-linejoin: round; }
.lbl-tribe { font-family: "Rokkitt", var(--serif); font-weight: 700; fill: var(--map-ink); fill-opacity: 0.82; }
.lbl-nation { font-family: "Rokkitt", var(--serif); font-weight: 700; fill: var(--map-ink); }
.lbl-kingdom { font-family: "Abril Fatface", var(--serif); fill: var(--deep-red); fill-opacity: 0.86; }
.lbl-sea { font-family: var(--serif); font-style: italic; fill: var(--wave); }
.lbl-river { font-family: var(--serif); font-style: italic; fill: var(--river); paint-order: stroke; stroke: var(--paper); stroke-width: 2.5px; stroke-opacity: 0.8; }
.lbl-lake { font-family: var(--serif); font-style: italic; fill: var(--river); paint-order: stroke; stroke: var(--paper); stroke-width: 3px; stroke-linejoin: round; }
.lbl-mount { font-family: var(--serif); font-weight: 400; fill: var(--map-ink); paint-order: stroke; stroke: var(--paper); stroke-width: 3px; stroke-linejoin: round; }
.lbl-region { font-family: var(--serif); font-style: italic; fill: var(--region-ink); letter-spacing: 0.22em; paint-order: stroke; stroke: var(--paper); stroke-width: 2.5px; stroke-opacity: 0.7; }
.lbl-margin { font: 600 11px/1 "Rokkitt", var(--serif); fill: var(--map-ink); }
.lbl-deg { font: 400 10px/1 var(--serif); fill: #5a4e3f; }
.dot { fill: var(--map-ink); stroke: var(--paper); stroke-width: 1.2px; }
.dot.unsure { fill: var(--paper); stroke: var(--map-ink); stroke-width: 1.3px; }
.cap-ring { fill: none; stroke: var(--map-ink); stroke-width: 1.3px; }
.tuft { fill: none; stroke: var(--map-ink); stroke-width: 1.1px; stroke-linecap: round; }
.sel { fill: none; stroke: var(--vermilion); stroke-width: 2.5px; }
.lbl-redsea { font-family: var(--serif); font-style: italic; fill: var(--deep-red); }
.lbl-region-line { font-family: var(--serif); font-style: italic; fill: var(--region-ink); }
.lbl-road { font-family: var(--serif); font-style: italic; fill: #6b4a2b; paint-order: stroke; stroke: var(--paper); stroke-width: 2.5px; stroke-opacity: 0.8; }
.lbl-station { font-family: var(--serif); font-weight: 700; fill: var(--jc-ink, var(--deep-red)); paint-order: stroke; stroke: var(--paper); stroke-width: 3px; stroke-linejoin: round; }
.lbl-station.unsure { font-weight: 400; }
.camp { fill: var(--jc, var(--vermilion)); stroke: var(--paper); stroke-width: 1.4px; }
.camp.unsure { fill: var(--paper); stroke: var(--jc, var(--vermilion)); stroke-width: 1.8px; }
.camp-no { font: 700 9.5px/1 var(--sans); fill: #fff; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.camp-no.unsure { fill: var(--jc-ink, var(--deep-red)); }
.sinai { fill: var(--paper); stroke: var(--deep-red); stroke-width: 1.5px; }
#stations ol { list-style: none; margin: 0; padding: 0; }
#stations li button {
  display: grid; grid-template-columns: 30px 1fr auto; gap: 2px 10px; width: 100%; text-align: left; border: 0;
  background: transparent; padding: 7px 8px; border-radius: 8px; cursor: pointer; align-items: baseline;
}
#stations li button:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
#stations .no { font: 700 13px/1.3 var(--sans); color: var(--accent); font-variant-numeric: tabular-nums; }
#stations .nm { font: 700 15px/1.25 var(--serif); }
#stations .sub { grid-column: 2 / 4; font-size: 12.5px; color: var(--muted); }
#stations .ref { font: 600 12px/1.6 var(--sans); color: var(--muted); }
#stations li.off .nm { font-weight: 400; }
#stations .journeys { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 30px 12px 0; }
#stations .journeys button {
  display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: transparent;
  border-radius: 99px; padding: 6px 11px; font: 600 12.5px/1.2 var(--sans); cursor: pointer; min-height: 32px;
}
#stations .journeys button[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
.sw { display: inline-block; width: 18px; height: 4px; border-radius: 2px; background: var(--jc, var(--vermilion)); flex: none; }
#stations .overview .no { display: flex; align-items: center; height: 100%; }
.periods { border: 0; margin: 0 0 6px; padding: 0; display: grid; gap: 6px; }
.periods legend { font: 600 12px/1.3 var(--sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; padding: 0; }

/* Print: the whole sheet on one page, as large as the paper allows. The sheet keeps its own
   shape and is fitted inside the page, so it fits Letter or A4, either way round. */
@page { size: {{PAGE}}; margin: 0.3in; }
@media print {
  html, body { height: auto; overflow: visible; background: #fff; margin: 0; padding: 0; }
  .bar, .zoom, .panel, .card { display: none !important; }
  #stage {
    position: static; width: 100%; height: auto; max-height: 100vh; aspect-ratio: var(--sheet-aspect);
    margin-inline: auto; overflow: hidden; break-inside: avoid; break-after: avoid;
  }
  #world, #labels { filter: none; }
}
</style>

<main id="stage" aria-label="{{SERIES}}, {{H1}}">
  <svg id="map" role="img" aria-labelledby="map-title">
    <title id="map-title">{{H1}}: {{DESCRIPTION}}</title>
    <defs>
      <clipPath id="frame-clip"><rect id="frame-rect"></rect></clipPath>
    </defs>
    <g id="world"></g>
    <g id="labels"></g>
  </svg>
</main>

<div class="bar">
  <div class="tag">
    <a class="home" href="index.html" title="All the Bible maps" aria-label="All the Bible maps"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5m0 0 6-6m-6 6 6 6"/></svg></a>
    <div class="txt">
    <div class="no">{{TAG}}<span class="wide"> · Style study</span><span class="draft">DRAFT</span></div>

    </div>
  </div>
  <nav class="tools" aria-label="Map tools">
    <button type="button" data-panel="find" aria-pressed="false" aria-label="Find a place"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span class="lbl">Find</span></button>
    <button type="button" data-panel="stations" aria-pressed="false" aria-label="Journeys and routes" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18c3-1 4-5 7-6s5 2 9-3"/><circle cx="4" cy="18" r="1.6"/><circle cx="11" cy="12" r="1.6"/><circle cx="20" cy="9" r="1.6"/></svg><span class="lbl" id="route-btn">Route</span></button>
    <button type="button" data-panel="layers" aria-pressed="false" aria-label="Layers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 13 9 5 9-5"/></svg><span class="lbl">Layers</span></button>
    <button type="button" data-panel="about" aria-pressed="false" aria-label="About this map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg><span class="lbl">About</span></button>
    <button type="button" id="print" aria-label="Print"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M7 9V3h10v6M7 17H4v-7h16v7h-3"/><path d="M7 14h10v7H7z"/></svg><span class="lbl">Print</span></button>
    <button type="button" id="save" aria-label="Download as SVG"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0-4.5-4.5M12 15l4.5-4.5M4 19h16"/></svg><span class="lbl">SVG</span></button>
  </nav>
</div>

<script src="../nav.js?v=46"></script>

<div class="zoom" role="group" aria-label="Zoom">
  <button type="button" id="zin" aria-label="Zoom in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <button type="button" id="zout" aria-label="Zoom out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>

{{ABOUT}}
</section>

  <button type="button" class="close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  <div class="journeys" role="group" aria-label="Choose a journey" hidden></div>
  <h2 class="ui-head" id="stations-title"></h2>

</section>

<!-- DATA -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const S = D.sheet;
const W = S.width, H = S.height, M = D.margin || 11;   // sheet margin, km
const NS = "http://www.w3.org/2000/svg";
const svg = d3.select("#map"), world = d3.select("#world"), labels = d3.select("#labels");
const JOURNEYS = D.journeys || [];
const state = { modern: false, relief: true, tribes: true, routes: true, grid: true, selected: null,
  journey: JOURNEYS.length === 1 ? 0 : -1, period: 0 };
const STEP = D.grid;                                // grid squares, in degrees
const COLS = Math.round((S.east - S.west) / STEP), ROWS = Math.round((S.north - S.south) / STEP);
const lonOf = x => S.west + x / S.kx, latOf = y => S.north - y / S.ky;
const xOf = lon => (lon - S.west) * S.kx, yOf = lat => (S.north - lat) * S.ky;
const ref = p => String.fromCharCode(65 + Math.min(COLS - 1, Math.floor((lonOf(p.x) - S.west) / STEP))) +
  (1 + Math.min(ROWS - 1, Math.floor((S.north - latOf(p.y)) / STEP)));
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

// Sheet furniture (km), kept clear of labels: the title block and the key, where Eilers put
// them. The key's height follows its rows.
const TITLE = D.title.box, KEY = D.key.box;
// The stops of the journey shown; none while every journey is shown at once.
let STATIONS = state.journey >= 0 ? JOURNEYS[state.journey].stops : [];
// The period shown, on maps whose lands change with time.
const period = () => (D.periods ? D.periods[state.period] : D);
const inkOf = c => `--jc: var(--route-${c}); --jc-ink: ${c === "red" ? "var(--deep-red)" : `var(--route-${c})`}`;

/* ---------- The sheet ---------- */

function el(parent, name, attrs, text) {
  const e = document.createElementNS(NS, name);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  parent.appendChild(e);
  return e;
}

function drawSheet() {
  const g = world.node();
  const nss = { "vector-effect": "non-scaling-stroke" };
  el(g, "rect", { x: -M, y: -M, width: W + 2 * M, height: H + 2 * M, fill: "var(--paper)" });
  d3.select("#frame-rect").attr("x", 0).attr("y", 0).attr("width", W).attr("height", H);
  const m = el(g, "g", { "clip-path": "url(#frame-clip)" });
  const L = D.layers;
  el(m, "rect", { x: 0, y: 0, width: W, height: H, fill: "var(--paper)" });
  el(m, "path", { d: L.ripples, fill: "none", stroke: "var(--wave)", "stroke-width": 0.55, opacity: 0.75, ...nss });
  el(m, "path", { d: L.land, fill: `var(--${D.land || "wild"})` });
  const terr = el(m, "g", {});
  for (const t of period().territories) el(terr, "path", { d: t.d, fill: `var(--${t.tint})`, stroke: `var(--${t.tint})`, "stroke-width": 0.6, ...nss });
  const relief = el(m, "g", { id: "relief" });
  L.hachures.forEach((d, k) => el(relief, "path", {
    d, fill: "none", stroke: "#3a2f24", "stroke-width": (0.6 + 0.38 * k).toFixed(2),
    opacity: (0.48 + 0.14 * k).toFixed(2), "stroke-linecap": "round", ...nss }));
  el(m, "path", { d: L.lakes, fill: "var(--water)" });
  el(m, "path", { d: L.lakeRipples, fill: "none", stroke: "var(--wave)", "stroke-width": 0.45, opacity: 0.8, ...nss });
  if (L.nile) el(m, "path", { d: L.nile, fill: "none", stroke: "var(--river)", "stroke-width": 1.8, "stroke-linejoin": "round", "stroke-linecap": "round", ...nss });
  L.rivers.forEach((d, k) => el(m, "path", {
    d, fill: "none", stroke: "var(--river)", "stroke-width": [0.75, 1.05, 1.7][k],
    "stroke-linejoin": "round", "stroke-linecap": "round", ...nss }));
  const borders = period().borders || L.borders || {};
  if (borders.tribe) el(m, "path", { id: "tribe-borders", d: borders.tribe, fill: "none", stroke: "var(--map-ink)", "stroke-width": 0.9,
    "stroke-dasharray": "5 3", opacity: 0.7, ...nss });
  if (borders.nation) {
    el(m, "path", { d: borders.nation, fill: "none", stroke: "var(--map-ink)", "stroke-width": 3.2, opacity: 0.18,
      "stroke-linejoin": "round", ...nss });
    el(m, "path", { d: borders.nation, fill: "none", stroke: "var(--map-ink)", "stroke-width": 1.3,
      "stroke-dasharray": "9 3 2 3", "stroke-linejoin": "round", ...nss });
  }
  el(m, "path", { d: L.lakes, fill: "none", stroke: "var(--map-ink)", "stroke-width": 0.9, ...nss });
  el(m, "path", { d: L.coast, fill: "none", stroke: "var(--map-ink)", "stroke-width": 1.15, ...nss });
  // Roads, then the journeys: a paper edge under each line, so it reads on every tint.
  const routes = el(m, "g", { id: "routes" });
  for (const r of D.roads || [])
    el(routes, "path", { d: r.d, fill: "none", stroke: "#6b4a2b", "stroke-width": 1.7, "stroke-dasharray": "0.1 5", "stroke-linecap": "round", opacity: 0.85, ...nss });
  JOURNEYS.forEach((J, j) => {
    const jg = el(routes, "g", { "data-j": j });
    for (const leg of J.legs)
      el(jg, "path", { d: leg.d, fill: "none", stroke: "var(--paper)", "stroke-width": 5.2, "stroke-linejoin": "round", "stroke-linecap": "round", opacity: 0.85, ...nss });
    for (const leg of J.legs)
      el(jg, "path", { d: leg.d, fill: "none", stroke: `var(--route-${J.color || "red"})`, "stroke-width": 2.6, "stroke-linejoin": "round", "stroke-linecap": "round",
        ...(leg.sure ? {} : { "stroke-dasharray": "9 6" }), ...nss });
  });
  showJourneyLines();
  // Graticule: ten-minute squares.
  let gd = "";
  for (let i = 1; i < COLS; i++) { const x = xOf(S.west + i * STEP).toFixed(2); gd += `M${x} 0V${H.toFixed(2)}`; }
  for (let j = 1; j < ROWS; j++) { const y = yOf(S.north - j * STEP).toFixed(2); gd += `M0 ${y}H${W.toFixed(2)}`; }
  el(m, "path", { id: "grid", d: gd, fill: "none", stroke: "var(--map-ink)", "stroke-width": 0.5, opacity: 0.38, ...nss });
  // Neat lines: a fine inner rule and a heavier outer one.
  el(g, "rect", { x: 0, y: 0, width: W, height: H, fill: "none", stroke: "var(--map-ink)", "stroke-width": 1, ...nss });
  el(g, "rect", { x: -M * 0.71, y: -M * 0.71, width: W + M * 1.42, height: H + M * 1.42, fill: "none",
    stroke: "var(--map-ink)", "stroke-width": 2, ...nss });
  drawTitle(g);
  drawKey(g);
}

function drawTitle(g) {
  // Lines from the data: [kind, text, baseline from the top of the box], in units scaled by D.title.scale.
  const { x, y, w, h } = TITLE, cx = x + w / 2, u = D.title.scale || 1;
  const b = el(g, "g", { class: "furniture" });
  el(b, "rect", { x, y, width: w, height: h, fill: "var(--paper)", stroke: "var(--map-ink)", "stroke-width": 1.2, "vector-effect": "non-scaling-stroke" });
  el(b, "rect", { x: x + 1.2 * u, y: y + 1.2 * u, width: w - 2.4 * u, height: h - 2.4 * u, fill: "none", stroke: "var(--map-ink)", "stroke-width": 0.5, "vector-effect": "non-scaling-stroke" });
  const STYLE = {
    series: { size: 3.1, family: "Rokkitt", "font-weight": 600, "letter-spacing": 0.5 },
    head: { size: 6.2, family: "Rokkitt", "font-weight": 700, "letter-spacing": 0.7 },
    display: { size: 9, family: "Abril Fatface", fill: "var(--deep-red)", "letter-spacing": 0.6 },
    "display-fit": { size: 9, family: "Abril Fatface", fill: "var(--deep-red)", fit: true },
    sub: { size: 4.2, family: "Rokkitt", "font-weight": 700, "letter-spacing": 0.45 },
    italic: { size: 3.1, family: "Old Standard TT", "font-style": "italic" },
    plain: { size: 3.2, family: "Old Standard TT" },
    credit: { size: 3, family: "Old Standard TT", "font-style": "italic" },
  };
  for (const [kind, text, dy, when] of D.title.lines) {
    if (when != null && when !== state.period) continue;
    if (kind === "rule") {
      el(b, "line", { x1: x + 14 * u, x2: x + w - 14 * u, y1: y + dy * u, y2: y + dy * u, stroke: "var(--map-ink)", "stroke-width": 0.6, "vector-effect": "non-scaling-stroke" });
      continue;
    }
    const st = STYLE[kind], attrs = { x: cx, y: y + dy * u, "text-anchor": "middle", "font-size": st.size * u, "font-family": st.family, fill: st.fill || "var(--map-ink)" };
    for (const k of ["font-weight", "font-style"]) if (st[k]) attrs[k] = st[k];
    if (st["letter-spacing"]) attrs["letter-spacing"] = st["letter-spacing"] * u;
    if (st.fit) { attrs.textLength = w - 8 * u; attrs.lengthAdjust = "spacingAndGlyphs"; }
    el(b, "text", attrs, text);
  }
}

function drawKey(g) {
  // Rows from the data: [kind, label, tint]. Sizes in units scaled by D.key.scale.
  const { x, y, w } = KEY, u = D.key.scale || 1;
  const b = el(g, "g", { class: "furniture" });
  const nss = { "vector-effect": "non-scaling-stroke" };
  const frame = el(b, "rect", { x, y, width: w, height: 10, fill: "var(--paper)", stroke: "var(--map-ink)", "stroke-width": 1.2, ...nss });
  const fs = 2.8 * u;
  const txt = (xx, yy, s, extra = {}) => el(b, "text", { x: xx, y: yy, "font-size": fs, "font-family": "Old Standard TT", fill: "var(--map-ink)", ...extra }, s);
  txt(x + w / 2, y + 6 * u, "KEY", { "text-anchor": "middle", "font-family": "Rokkitt", "font-weight": 700, "letter-spacing": u, "font-size": 3.8 * u });
  let yy = y + 11.5 * u;
  const line = (a, c, attrs) => el(b, "path", { d: `M${a - 3.5 * u} ${c}h${7 * u}`, fill: "none", ...attrs });
  const symbols = {
    dot: (a, c) => el(b, "circle", { cx: a, cy: c, r: 0.85 * u, fill: "var(--map-ink)" }),
    unsure: (a, c) => el(b, "circle", { cx: a, cy: c, r: 0.8 * u, fill: "var(--paper)", stroke: "var(--map-ink)", "stroke-width": 0.35 * u }),
    royal: (a, c) => { el(b, "circle", { cx: a, cy: c, r: 1.5 * u, fill: "none", stroke: "var(--map-ink)", "stroke-width": 0.35 * u }); el(b, "circle", { cx: a, cy: c, r: 0.75 * u, fill: "var(--map-ink)" }); },
    mount: (a, c) => el(b, "path", { d: tuftPath(a, c + 0.7 * u, 1.9 * u), fill: "none", stroke: "var(--map-ink)", "stroke-width": 0.3 * u, "stroke-linecap": "round" }),
    river: (a, c) => el(b, "path", { d: `M${a - 3.5 * u} ${c}c${1.2 * u} ${-u} ${2.3 * u} ${u} ${3.5 * u} 0s${2.3 * u} ${u} ${3.5 * u} 0`, fill: "none", stroke: "var(--river)", "stroke-width": 0.45 * u }),
    nation: (a, c) => line(a, c, { stroke: "var(--map-ink)", "stroke-width": 0.42 * u, "stroke-dasharray": `${2.6 * u} ${0.9 * u} ${0.7 * u} ${0.9 * u}` }),
    tribe: (a, c) => line(a, c, { stroke: "var(--map-ink)", "stroke-width": 0.3 * u, "stroke-dasharray": `${1.6 * u} ${u}`, opacity: 0.8 }),
    route: (a, c) => line(a, c, { stroke: "var(--vermilion)", "stroke-width": 0.75 * u }),
    conjectural: (a, c) => line(a, c, { stroke: "var(--vermilion)", "stroke-width": 0.75 * u, "stroke-dasharray": `${1.8 * u} ${1.1 * u}` }),
    road: (a, c) => line(a, c, { stroke: "#6b4a2b", "stroke-width": 0.5 * u, "stroke-dasharray": `${0.3 * u} ${1.1 * u}`, "stroke-linecap": "round" }),
    camp: (a, c) => { el(b, "circle", { cx: a, cy: c, r: 1.5 * u, fill: "var(--vermilion)" }); el(b, "text", { x: a, y: c + 0.55 * u, "font-size": 1.6 * u, "text-anchor": "middle", fill: "#fff", "font-family": "Libre Franklin", "font-weight": 700 }, "7"); },
    "camp-unsure": (a, c) => { el(b, "circle", { cx: a, cy: c, r: 1.5 * u, fill: "var(--paper)", stroke: "var(--vermilion)", "stroke-width": 0.35 * u }); el(b, "text", { x: a, y: c + 0.55 * u, "font-size": 1.6 * u, "text-anchor": "middle", fill: "var(--deep-red)", "font-family": "Libre Franklin", "font-weight": 700 }, "9"); },
    sinai: (a, c) => el(b, "path", { d: `M${a} ${c - 1.6 * u}l${1.5 * u} ${2.6 * u}h${-3 * u}z`, fill: "var(--paper)", stroke: "var(--deep-red)", "stroke-width": 0.35 * u }),
    journey: (a, c, color) => line(a, c, { stroke: `var(--route-${color})`, "stroke-width": 0.75 * u }),
    sea: (a, c, color) => line(a, c, { stroke: `var(--route-${color || "red"})`, "stroke-width": 0.75 * u, "stroke-dasharray": `${0.3 * u} ${1.1 * u}`, "stroke-linecap": "round" }),
  };
  for (const [kind, label, tint, when] of D.key.rows) {
    if (when != null && when !== state.period) continue;
    if (kind === "gap") { yy += 1.6 * u; continue; }
    if (kind === "names") {
      txt(x + 4 * u, yy, label[0], { "font-weight": 700 }); txt(x + 19 * u, yy, "Bible name"); yy += 4.2 * u;
      txt(x + 4 * u, yy, label[1], { "font-style": "italic" }); txt(x + 19 * u, yy, "Modern name"); yy += 5.4 * u;
      continue;
    }
    if (kind === "swatch") {
      el(b, "rect", { x: x + 4.5 * u, y: yy - 2.5 * u, width: 4.2 * u, height: 3.1 * u, fill: `var(--${tint})`, stroke: "var(--map-ink)", "stroke-width": 0.25 * u });
      txt(x + 12 * u, yy, label); yy += 4.2 * u;
      continue;
    }
    symbols[kind](x + 6.5 * u, yy - 0.95 * u, tint);
    txt(x + 12 * u, yy, label);
    yy += 4.4 * u;
  }
  yy += 2.4 * u;
  // Scale bars: English miles, as Eilers had, and kilometres.
  const sx = x + 4 * u, mile = 1.609344, [miles, kms] = D.key.scale_bars || [[0, 5, 10, 15, 20], [0, 10, 20, 30]];
  const bar = (ticks, unit, by) => {
    const len = ticks[ticks.length - 1].at;
    el(b, "rect", { x: sx, y: by, width: len, height: u, fill: "var(--paper)", stroke: "var(--map-ink)", "stroke-width": 0.25 * u });
    ticks.forEach((tk, i) => {
      if (i < ticks.length - 1 && i % 2 === 0) el(b, "rect", { x: sx + tk.at, y: by, width: ticks[i + 1].at - tk.at, height: u, fill: "var(--map-ink)" });
      txt(sx + tk.at, by - 0.8 * u, tk.label, { "text-anchor": "middle", "font-size": 2.4 * u });
    });
    txt(sx + len + 1.4 * u, by + u, unit, { "font-size": 2.4 * u });
  };
  bar(miles.map(v => ({ at: v * mile, label: v })), "miles", yy);
  bar(kms.map(v => ({ at: v, label: v })), "km", yy + 5.6 * u);
  KEY.h = yy + 9 * u - y;
  frame.setAttribute("height", KEY.h);
}

function tuftPath(cx, cy, r) {
  // A small hachured peak: short strokes fanning out and down from the summit.
  let d = "";
  for (let i = -3; i <= 3; i++) {
    const a = Math.PI / 2 + i * 0.36;
    const x1 = cx + Math.cos(a) * r * 0.25, y1 = cy - r * 0.55 + Math.sin(a) * r * 0.25;
    const len = r * (1.05 - Math.abs(i) * 0.12);
    d += `M${x1.toFixed(2)} ${y1.toFixed(2)}l${(Math.cos(a) * len).toFixed(2)} ${(Math.sin(a) * len * 0.8).toFixed(2)}`;
  }
  return d;
}

/* ---------- Labels ---------- */

const ctx = document.createElement("canvas").getContext("2d");
const widthCache = new Map();
function measure(text, font) {
  const key = font + "|" + text;
  let w = widthCache.get(key);
  if (w == null) { ctx.font = font; w = ctx.measureText(text).width; widthCache.set(key, w); }
  return w;
}
const F = {
  place: (s, unsure) => `${unsure ? 400 : 700} ${s}px "Old Standard TT"`,
  modern: s => `italic 400 ${s}px "Old Standard TT"`,
  tribe: s => `700 ${s}px Rokkitt`,
  kingdom: s => `400 ${s}px "Abril Fatface"`,
  italic: s => `italic 400 ${s}px "Old Standard TT"`,
  mount: s => `400 ${s}px "Old Standard TT"`,
};

// Boxes already taken, in screen pixels, in a coarse spatial hash.
class Boxes {
  constructor() { this.cells = new Map(); this.size = 48; }
  key(i, j) { return i * 100003 + j; }
  hits(b) {
    const s = this.size;
    for (let i = Math.floor(b[0] / s); i <= Math.floor(b[2] / s); i++)
      for (let j = Math.floor(b[1] / s); j <= Math.floor(b[3] / s); j++) {
        const list = this.cells.get(this.key(i, j));
        if (list) for (const o of list) if (b[0] < o[2] && b[2] > o[0] && b[1] < o[3] && b[3] > o[1]) return true;
      }
    return false;
  }
  add(b) {
    const s = this.size;
    for (let i = Math.floor(b[0] / s); i <= Math.floor(b[2] / s); i++)
      for (let j = Math.floor(b[1] / s); j <= Math.floor(b[3] / s); j++) {
        const k = this.key(i, j);
        if (!this.cells.has(k)) this.cells.set(k, []);
        this.cells.get(k).push(b);
      }
  }
}

function polyAt(pts) {
  // Cumulative lengths of a screen polyline, and a function giving point and direction at a distance.
  const cum = [0];
  for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  const at = d => {
    let i = 1;
    while (i < pts.length - 1 && cum[i] < d) i++;
    const seg = cum[i] - cum[i - 1] || 1, t = Math.max(0, Math.min(1, (d - cum[i - 1]) / seg));
    const dx = pts[i][0] - pts[i - 1][0], dy = pts[i][1] - pts[i - 1][1], n = Math.hypot(dx, dy) || 1;
    return [pts[i - 1][0] + dx * t, pts[i - 1][1] + dy * t, dx / n, dy / n];
  };
  return { length: cum[cum.length - 1], at };
}

// Spread a name's letters, each upright, along a line through its region: the Eilers manner.
function spreadLetters(text, ptsKm, T, opt) {
  const pts = ptsKm.map(p => [p[0] * T.k + T.x, p[1] * T.k + T.y]);
  const poly = polyAt(pts);
  const n = text.length;
  let s = opt.size;
  let span = Math.min(poly.length * (opt.fill ?? 0.84), n * s * (opt.gap ?? 2.6));
  if (span < n * s * 1.0) { s = span / n; if (s < opt.min) return null; }
  const font = opt.font(s);
  const tries = opt.tries ?? [[0, 0], [0.9, 0], [-0.9, 0], [0, 0.1], [0, -0.1], [1.8, 0], [-1.8, 0], [0.9, 0.12], [-0.9, -0.12]];
  for (const [off, slide] of tries) {
    const start = (poly.length - span) / 2 + slide * poly.length;
    if (start < 0 || start + span > poly.length) continue;
    const out = [];
    let ok = true;
    for (let i = 0; i < n; i++) {
      const ch = text[i];
      if (ch === " ") continue;
      const [x0, y0, ux, uy] = poly.at(start + span * (i + 0.5) / n);
      const x = x0 - uy * off * s, y = y0 + ux * off * s;
      const w = measure(ch, font);
      const b = [x - w / 2 - 1, y - s * 0.36 - 1, x + w / 2 + 1, y + s * 0.36 + 1];
      if (!opt.force && (opt.boxes.hits(b) || offView(b) || offSheet(b))) { ok = false; break; }
      out.push({ ch, x, y, b });
    }
    if (ok && out.length) return { s, letters: out };
    if (opt.force && out.length) return { s, letters: out };
  }
  return null;
}

let view = { w: 0, h: 0 }, sheetBox = null;
const offView = b => b[2] < -40 || b[0] > view.w + 40 || b[3] < -40 || b[1] > view.h + 40;
// Names stay inside the neat line, as on the printed sheet.
const offSheet = b => sheetBox && (b[0] < sheetBox[0] || b[1] < sheetBox[1] || b[2] > sheetBox[2] || b[3] > sheetBox[3]);
const inView = (x, y, pad = 0) => x >= -pad && x <= view.w + pad && y >= -pad && y <= view.h + pad;

// A place drawn as a numbered stop of the journey shown.
const onJourney = p => p.st && state.journey >= 0 && p.st.some(s => s[0] === state.journey);

function placeLabels(T, root, size) {
  view = size;
  const LABELS = D.periods ? D.labels.concat(period().labels || []) : D.labels;
  const ink = state.journey >= 0 ? inkOf(JOURNEYS[state.journey].color || "red") : "";
  root.textContent = "";
  const boxes = new Boxes();
  const k = T.k;
  sheetBox = [T.x + 2, T.y + 2, W * k + T.x - 2, H * k + T.y - 2];
  const add = (cls, x, y, txt, s, extra = {}) => el(root, "text", { class: cls, x: x.toFixed(1), y: y.toFixed(1), "font-size": s.toFixed(1), ...extra }, txt);
  // Furniture is off limits.
  for (const f of [TITLE, KEY]) boxes.add([f.x * k + T.x - 4, f.y * k + T.y - 4, (f.x + f.w) * k + T.x + 4, (f.y + f.h) * k + T.y + 4]);
  // Margin rulers: letters along the top and bottom, numbers down the sides, kept on screen.

        const rect = svg.node().getBoundingClientRect();
        const k = Math.max(T.k, fitK * 4);
        const t = d3.zoomIdentity.translate(rect.width / 2 - p.x * k, rect.height * 0.42 - p.y * k).scale(k);
        if (UI.phone()) openPanel("find");
        svg.transition().duration(dur(650)).call(zoom.transform, t).on("end", () => showCard(i));
      };
      li.append(b); list.append(li);
    }
  };
  input.addEventListener("input", fill);
  fill();
}

function stopSub(st, stops) {
  const host = hostIn(stops, st);
  return host ? `${st.site} · shown with ${(JOURNEYS[state.journey]?.unit || "stop").toLowerCase()} ${host.n}`
    : st.x == null ? (st.site ? `Not plotted · proposed: ${st.site}` : "Not plotted · site unknown")
    : [st.site, confidence(st).toLowerCase()].filter(Boolean).join(" · ");
}
const hostIn = (stops, st) => stops.find(o => (o.also || []).includes(st.n));

function fillJourneyPanel() {
  const list = document.querySelector("#stations ol");
  list.textContent = "";
  list.classList.toggle("overview", state.journey < 0);
  for (const b of document.querySelectorAll("#stations .journeys button")) b.setAttribute("aria-pressed", String(+b.dataset.j === state.journey));
  if (state.journey < 0) {
    // Every journey at once: pick one to follow it stop by stop.
    document.getElementById("stations-title").textContent = D.routesTitle || "Journeys";
    document.getElementById("stations-note").textContent = D.routesNote || "";
    JOURNEYS.forEach((J, j) => {
      const li = document.createElement("li"), b = document.createElement("button");
      b.type = "button";
      b.innerHTML = '<span class="no"><span class="sw"></span></span><span class="nm"></span><span class="ref"></span><span class="sub"></span>';
      b.querySelector(".sw").setAttribute("style", inkOf(J.color || "red"));
      b.querySelector(".nm").textContent = J.name;
      b.querySelector(".ref").textContent = J.ref || "";
      b.querySelector(".sub").textContent = `${J.stops.length} ${(J.unit || "stop").toLowerCase()}s` + (J.summary ? " · " + J.summary : "");
      b.onclick = () => selectJourney(j);
      li.append(b); list.append(li);
    });
    return;
  }
  const J = JOURNEYS[state.journey];
  document.getElementById("stations-title").textContent = J.name;
  document.getElementById("stations-note").textContent = J.note || "";
  STATIONS.forEach((st, j) => {
    const li = document.createElement("li"), b = document.createElement("button");
    b.type = "button";
    b.innerHTML = '<span class="no"></span><span class="nm"></span><span class="ref"></span><span class="sub"></span>';
    b.querySelector(".no").textContent = st.n;
    b.querySelector(".no").setAttribute("style", J.color && J.color !== "red" ? `color: var(--route-${J.color})` : "");
    b.querySelector(".nm").textContent = st.name + (st.x != null && !st.sure ? "?" : "");
    b.querySelector(".ref").textContent = st.ref;
    const host = hostIn(STATIONS, st), at = host || st;
    if (st.x == null && !host) li.className = "off";
    b.querySelector(".sub").textContent = stopSub(st, STATIONS);
    b.onclick = () => {
      if (at.x == null) { showStation(j); return; }
      const rect = svg.node().getBoundingClientRect();
      const k = Math.max(T.k, fitK * 3);
      const t = d3.zoomIdentity.translate(rect.width / 2 - at.x * k, rect.height * 0.42 - at.y * k).scale(k);
      if (UI.phone()) openPanel("stations");
      svg.transition().duration(dur(650)).call(zoom.transform, t).on("end", () => showStation(j));
    };
    li.append(b); list.append(li);
  });
}

function showJourneyLines() {
  for (const g of document.querySelectorAll("#routes [data-j]"))
    g.style.display = state.journey < 0 || +g.dataset.j === state.journey ? "" : "none";
}

function selectJourney(j) {
  state.journey = j;
  STATIONS = j >= 0 ? JOURNEYS[j].stops : [];
  state.selected = null;
  document.getElementById("card").hidden = true;
  showJourneyLines();
  fillJourneyPanel();
  render();
}

function buildJourneys() {
  if (!JOURNEYS.length) return;
  document.querySelector('[data-panel="stations"]').hidden = false;
  document.getElementById("route-btn").textContent = D.routeButton || "Route";
  if (JOURNEYS.length > 1) {
    const box = document.querySelector("#stations .journeys");
    box.hidden = false;
    const chip = (j, text, color) => {
      const b = document.createElement("button");
      b.type = "button"; b.dataset.j = j;
      if (color) { const sw = document.createElement("span"); sw.className = "sw"; sw.setAttribute("style", inkOf(color)); b.append(sw); }
      b.append(text);
      b.onclick = () => selectJourney(j);
      box.append(b);
    };
    chip(-1, "All");
    JOURNEYS.forEach((J, j) => chip(j, J.short, J.color || "red"));
  }
  fillJourneyPanel();
}

/* ---------- Print and SVG ---------- */

function sheetSVG(wPx, hPx) {
  // A standalone copy of the whole sheet, labelled for a page of the given size.
  const t = fitTransform(wPx, hPx, 0);
  const out = document.createElementNS(NS, "svg");
  out.setAttribute("xmlns", NS);
  out.setAttribute("viewBox", `0 0 ${wPx} ${hPx}`);
  out.setAttribute("width", wPx); out.setAttribute("height", hPx);
  const style = document.createElementNS(NS, "style");
  const vars = ["--paper", "--wild", "--yellow", "--salmon", "--blush", "--lime", "--sage", "--olive", "--water", "--map-ink", "--vermilion", "--deep-red", "--river", "--wave", "--region-ink",
    "--route-red", "--route-blue", "--route-green", "--route-violet", "--route-brown", "--route-black"];
  let cssText = "@import url('https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Rokkitt:wght@500;600;700&display=swap');\n";
  cssText += "svg{" + vars.map(v => `${v}:${css(v)}`).join(";") + "}\n";
  for (const sheet of document.styleSheets) {
    try { for (const r of sheet.cssRules) if (r.selectorText && /\.(lbl|dot|cap-ring|tuft|camp|sinai)/.test(r.selectorText)) cssText += r.cssText + "\n"; } catch (e) { /* cross-origin font sheet */ }
  }
  cssText = cssText.replace(/var\(--serif\)/g, '"Old Standard TT", Georgia, serif');
  style.textContent = cssText;
  out.append(style);
  out.append(document.querySelector("#map defs").cloneNode(true));
  const w = world.node().cloneNode(true);
  w.removeAttribute("id");
  w.setAttribute("transform", `translate(${t.x},${t.y}) scale(${t.k})`);
  out.append(w);
  const lab = document.createElementNS(NS, "g");
  const saved = state.selected; state.selected = null;
  placeLabels(t, lab, { w: wPx, h: hPx });
  state.selected = saved;
  for (const h of lab.querySelectorAll(".hit")) h.remove();
  out.append(lab);
  return out;
}

document.getElementById("save").onclick = () => {
  const { w, h } = pageSize();
  const s = new XMLSerializer().serializeToString(sheetSVG(w, h));
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([s], { type: "image/svg+xml" }));
  a.download = D.file + ".svg";
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
};

// The printed sheet in CSS pixels: its long side about the width of a page (10.3 in at 96 px to
// the inch), its short side in proportion, so the names print at the size they show on screen.
function pageSize() {
  const a = (W + 2 * M) / (H + 2 * M);
  return a >= 1 ? { w: 990, h: Math.round(990 / a) } : { w: Math.round(990 * a), h: 990 };
}
document.getElementById("stage").style.setProperty("--sheet-aspect", `${W + 2 * M} / ${H + 2 * M}`);

let printing = null;
function beforePrint() {
  if (printing) return;
  printing = T;
  const { w, h } = pageSize();
  const t = fitTransform(w, h, 0);
  svg.attr("viewBox", `0 0 ${w} ${h}`);
  world.attr("transform", t);
  labels.attr("transform", null);
  placeLabels(t, labels.node(), { w, h });
}
function afterPrint() {
  if (!printing) return;
  svg.attr("viewBox", null);
  world.attr("transform", T);
  printing = null;
  render();
}
window.addEventListener("beforeprint", beforePrint);
window.addEventListener("afterprint", afterPrint);
document.getElementById("print").onclick = () => { beforePrint(); window.print(); };

/* ---------- Start ---------- */

function applyLayers() {
  document.getElementById("relief").style.display = state.relief ? "" : "none";
  const tb = document.getElementById("tribe-borders");
  if (tb) tb.style.display = state.tribes ? "" : "none";
  document.getElementById("routes").style.display = state.routes ? "" : "none";
  document.getElementById("grid").style.display = state.grid ? "" : "none";
}

drawSheet();
buildIndex();
buildJourneys();
const anyTribes = (D.periods || [D]).some(P => (P.borders || D.layers.borders || {}).tribe);
for (const lab of document.querySelectorAll("[data-needs]"))
  lab.hidden = !(lab.dataset.needs === "tribes" ? anyTribes : JOURNEYS.length || (D.roads || []).length);
if (D.routeLayer) document.getElementById("route-layer").textContent = D.routeLayer;
if (D.periods) {
  // Lands that changed with time: one period at a time, chosen in the title tag or in Layers.
  const box = document.getElementById("periods"), pick = document.getElementById("period-pick");
  box.hidden = pick.hidden = false;
  const showPeriod = k => {
    state.period = k;
    pick.value = String(k);
    for (const r of box.querySelectorAll("input")) r.checked = +r.value === k;
    world.node().textContent = "";
    drawSheet();
    applyLayers();
    render();
  };
  D.periods.forEach((P, k) => {
    const lab = document.createElement("label");
    lab.innerHTML = '<input type="radio" name="period"> <span><small></small></span>';
    lab.querySelector("input").value = k;
    lab.querySelector("input").checked = k === state.period;
    lab.querySelector("span").prepend(P.name);
    lab.querySelector("small").textContent = P.note || "";
    lab.querySelector("input").onchange = () => showPeriod(k);
    box.append(lab);
    pick.add(new Option(P.name, String(k)));
  });
  pick.value = String(state.period);
  pick.onchange = () => showPeriod(+pick.value);
}
for (const b of document.querySelectorAll("[data-panel]")) b.onclick = () => openPanel(b.dataset.panel);
for (const b of document.querySelectorAll(".panel .close")) b.onclick = () => openPanel(null);
for (const box of document.querySelectorAll("[data-layer]")) box.onchange = () => {
  state[box.dataset.layer] = box.checked;
  applyLayers();
  render();
};
labels.on("click", ev => {
  const i = ev.target.getAttribute && ev.target.getAttribute("data-i");
  const st = ev.target.getAttribute && ev.target.getAttribute("data-st");
  if (i != null) showCard(+i);
  else if (st != null) showStation(+st);
});
document.addEventListener("keydown", ev => {
  if (ev.target.tagName === "INPUT") return;
  if (ev.key === "+" || ev.key === "=") svg.transition().duration(dur(250)).call(zoom.scaleBy, 1.6);
  else if (ev.key === "-") svg.transition().duration(dur(250)).call(zoom.scaleBy, 1 / 1.6);
  else if (ev.key === "Escape") { openPanel(null); document.getElementById("card").hidden = true; state.selected = null; render(); }
});
document.getElementById("zin").onclick = () => svg.transition().duration(dur(300)).call(zoom.scaleBy, 1.8);
document.getElementById("zout").onclick = () => svg.transition().duration(dur(300)).call(zoom.scaleBy, 1 / 1.8);
document.getElementById("zfit").onclick = () => svg.transition().duration(dur(500)).call(zoom.transform, setup());
svg.call(zoom).on("dblclick.zoom", null);
const start = setup(true);
svg.call(zoom.transform, start);
// A place asked for in the address: name it, then zoom in to it from the whole sheet.
const linked = link.get("place") ? D.places.findIndex(p => p.id.split("/")[0] === link.get("place")) : -1;
if (linked >= 0) {
  const p = D.places[linked], rect = svg.node().getBoundingClientRect(), k = fitK * 4;
  showCard(linked);
  setTimeout(() => svg.transition().duration(dur(900))
    .call(zoom.transform, d3.zoomIdentity.translate(rect.width / 2 - p.x * k, rect.height * 0.42 - p.y * k).scale(k)), 200);
}
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { widthCache.clear(); render(); });
window.addEventListener("resize", () => { setup(); schedule(); });
</script>
