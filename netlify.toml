# Netlify settings. The website is the repository itself: index.html (the reader) is at the
# root, with the pages, maps and data it links to beside it.
#
# Everything the site needs is already built and committed (scripts/translation.py,
# connections.py, maps.py and reader.py), so Netlify only publishes the folder: there is no
# build step. To rebuild the data, run those scripts locally and commit the result. The other
# folders (the source texts, the translation, the Obsidian notes) are published too, as plain
# files; they are open data, and nothing links to them.

[build]
  publish = "."
  command = "echo 'Nothing to build: the site is committed ready to serve'"

# A test environment: keep the drafts out of search engines until the site launches.
# Remove this header, and robots.txt, when it goes live.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Book and lexicon files change only when the data is rebuilt; let browsers keep them for an
# hour and then check for a newer copy.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# The service worker must always be fresh, so a new version of the reader reaches readers.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# The page templates only work once the build scripts fill in their data; don't serve them.
[[redirects]]
  from = "/scripts/templates/*"
  to = "/404.html"
  status = 404
