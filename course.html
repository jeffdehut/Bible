<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="i18n.js?v=51"></script>
<script src="ui.js?v=3"></script>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d111b" media="(prefers-color-scheme: dark)">
<script>try { const t = (JSON.parse(localStorage.getItem("pe.settings")) || {}).theme; if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (e) { /* storage unavailable */ }</script>
<title>Three-Year Course · BibleData.org</title>
<meta name="description" content="The whole Bible taught in three years, a quarter at a time.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300..700&family=Libre+Franklin:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #fbfaf7; --surface: #ffffff; --ink: #161b26; --muted: #5b6475; --faint: #8a91a0; --line: #e4e2db;
  --lapis: #2646a1; --lapis-soft: #e7ecf8;
  --read: "Frank Ruhl Libre", "Noto Serif", Georgia, serif;
  --sans: "Libre Franklin", system-ui, -apple-system, "Segoe UI", sans-serif;
  --bar: 56px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0d111b; --surface: #131a28; --ink: #e9ecf3; --muted: #a3acbd; --faint: #7d8799; --line: #263047; --lapis: #9db3ff; --lapis-soft: #1c2650; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #0d111b; --surface: #131a28; --ink: #e9ecf3; --muted: #a3acbd; --faint: #7d8799; --line: #263047; --lapis: #9db3ff; --lapis-soft: #1c2650; color-scheme: dark; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 17px/1.6 var(--sans); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
:focus-visible { outline: 2px solid var(--lapis); outline-offset: 2px; border-radius: 4px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 11; background: var(--bg); }
.appbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; height: var(--bar);
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))) calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding-inline: max(8px, env(safe-area-inset-left, 0px)) max(8px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; gap: 4px; background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line);
}
.appbar .brand { display: inline-flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 8px; border-radius: 10px; color: var(--ink); text-decoration: none; white-space: nowrap; font: 500 17px/1 var(--read); }
.appbar .brand img { width: 26px; height: 26px; border-radius: 7px; flex: none; }
.appbar .sitenav-btn { margin-inline-start: auto; }
main { max-width: 960px; margin-inline: auto; padding-block: clamp(28px, 6vw, 52px) 72px; }
.kicker { margin: 0 0 6px; font: 600 13px/1.2 var(--sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 0 0 10px; font: 300 clamp(38px, 7vw, 56px)/1.02 var(--read); letter-spacing: -0.02em; }
.lede { margin: 0 0 30px; max-width: 640px; color: var(--muted); }
.year { margin: 0 0 30px; }
.year h2 { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; font: 500 26px/1.2 var(--read); }
.year h2 i { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 10px; background: var(--c); color: #fff; font: 700 16px/1 var(--sans); font-style: normal; }
.quarters { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin: 0; padding: 0; list-style: none; }
.quarters li { position: relative; min-height: 132px; padding: 16px; border: 1px dashed color-mix(in srgb, var(--c) 45%, var(--line)); border-radius: 16px; background: color-mix(in srgb, var(--c) 6%, var(--surface)); }
.quarters b { display: block; font: 600 13px/1.2 var(--sans); letter-spacing: 0.06em; text-transform: uppercase; color: var(--c); }
.quarters span { display: block; margin-top: 8px; font: 500 19px/1.3 var(--read); color: var(--faint); }
.quarters small { position: absolute; left: 16px; bottom: 14px; font: 500 12px/1 var(--sans); color: var(--faint); }
</style>
</head>
<body>
<header class="appbar">
  <a class="brand" href="index.html"><img src="icons/icon.svg" alt="BibleData.org"><span aria-hidden="true">BibleData.org</span></a>
</header>
<script src="nav.js?v=46"></script>
<main>
  <p class="kicker">Resource Room</p>
  <h1>The Bible in Three Years</h1>
  <p class="lede">The whole Bible, taught a quarter at a time: twelve quarters over three years. The outline for each quarter is coming soon.</p>
  <section class="year" style="--c:#2459c4"><h2><i>1</i>Year one</h2><ul class="quarters" id="y1"></ul></section>
  <section class="year" style="--c:#2f8a3c"><h2><i>2</i>Year two</h2><ul class="quarters" id="y2"></ul></section>
  <section class="year" style="--c:#6d43c9"><h2><i>3</i>Year three</h2><ul class="quarters" id="y3"></ul></section>
</main>
<script>
// Twelve quarters, to be filled in: each a block for now.
for (let y = 1; y <= 3; y++) {
  const ul = document.getElementById("y" + y);
  for (let q = 1; q <= 4; q++) {
    const li = document.createElement("li");
    li.innerHTML = `<b>Quarter ${q}</b><span>To be planned</span><small>13 weeks</small>`;
    ul.append(li);
  }
}
</script>
</body>
</html>
